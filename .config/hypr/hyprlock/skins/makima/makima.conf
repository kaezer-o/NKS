# NeKoRoSHELL Makima lockscreen
# Dark charcoal + deep red + warm white palette.

source = ~/.cache/wallust/colors-hyprland.conf

general {
    no_fade_in = false
    immediate_render = false
    grace = 2
    ignore_empty_input = true
    disable_loading_bar = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 1.8, linear
    animation = fadeOut, 1, 1.8, linear
}

background {
    monitor =
    path = screenshot
    color = $background
    blur_passes = 2
    brightness = 0.34
}

input-field {
    placeholder_text =
    size = 15%, 5%
    outline_thickness = 2
    inner_color = rgba(8, 8, 9, 0.72)
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = $foreground
    fail_color = rgba(203, 24, 48, 1.0) 40deg
    font_color = $foreground
    fade_on_empty = false
    rounding = 50
    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +\"%A, %B %d\")"
    color = $foreground
    font_size = 16
    font_family = JetBrains Mono
    position = 0, 285
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +\"%-I:%M\")"
    color = $foreground
    font_size = 95
    font_family = JetBrains Mono Extrabold
    position = 0, 200
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.face.icon
    size = 100
    border_size = 2
    border-radius: 50%
    border_color = rgba(203, 24, 48, 0.88)
    position = 0, 15
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "hello, $USER!"
    color = $foreground
    font_size = 14
    font_family = JetBrains Mono
    position = 0, -85
    halign = center
    valign = center
}

label {
    monitor =
    text = <span> ⏻ </span>
    color = $foreground
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = -65, 85
    halign = center
    valign = bottom
    onclick = sys-power shutdown
}

label {
    monitor =
    text = <span> 󰜉 </span>
    color = rgba(203, 24, 48, 0.92)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 85
    halign = center
    valign = bottom
    onclick = sys-power reboot
}

label {
    monitor =
    text = <span> 󰤄 </span>
    color = $foreground
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 65, 85
    halign = center
    valign = bottom
    onclick = sys-power suspend
}
