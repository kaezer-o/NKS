# NeKoRoSHELL Makima light lockscreen
# Pale warm background + deep red accents + exact-inverse text.

source = ~/.cache/wallust/colors-hyprland.conf

general {
    no_fade_in = false
    immediate_render = false
    grace = 2
    ignore_empty_input = true
    disable_loading_bar = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 1.5, linear
    animation = fadeOut, 1, 1.5, linear
}

background {
    monitor =
    path = screenshot
    color = $background
    blur_passes = 1
    brightness = 0.26
}

input-field {
    placeholder_text =
    size = 15%, 5%
    outline_thickness = 2
    inner_color = rgba(255, 255, 255, 0.45)
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = $foreground
    fail_color = $color1 40deg
    font_color = $foreground
    fade_on_empty = false
    rounding = 50
    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +\"%A, %B %d\")"
    color = $foreground
    font_size = 16
    font_family = JetBrains Mono
    position = 0, 175
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +\"%-I:%M\")"
    color = $foreground
    font_size = 90
    font_family = JetBrains Mono Extrabold
    position = 0, 265
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.face.icon
    size = 100
    border_size = 2
    border-radius: 50%
    border_color = $color1
    position = 0, 15
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "hello, $USER!"
    color = $foreground
    font_size = 14
    font_family = JetBrains Mono
    position = 0, -85
    halign = center
    valign = center
}

label {
    monitor =
    text = <span> ⏻ </span>
    color = $foreground
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = -65, 85
    halign = center
    valign = bottom
    onclick = sys-power shutdown
}

label {
    monitor =
    text = <span> 󰜉 </span>
    color = $color1
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 85
    halign = center
    valign = bottom
    onclick = sys-power reboot
}

label {
    monitor =
    text = <span> 󰤄 </span>
    color = $foreground
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 65, 85
    halign = center
    valign = bottom
    onclick = sys-power suspend
}
