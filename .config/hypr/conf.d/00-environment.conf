#############################
### ENVIRONMENT VARIABLES ###
#############################

env = PATH,$HOME/bin/nekoroshell:$HOME/.local/bin/nekoroshell:$PATH

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice

env = XDG_MENU_PREFIX,arch-
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct # also set in /etc/environment to be sure, do not override style with kvantum here.
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_ENABLE_HIGHDPI_SCALING,1
env = GDK_SCALE,1 
env = GDK_DPI_SCALE,1

env = CURSOR_FLAGS,wayland
env = MOZ_ENABLE_WAYLAND,1

env = GDK_BACKEND,wayland,x11,*
env = ELECTRON_OZONE_PLATFORM_HINT,auto-wayland
env = SDL_VIDEODRIVER,wayland
env = QT_QPA_PLATFORM,wayland;xcb
