###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Applications
bind = $mainMod, RETURN, exec, setsid -f kitty >/dev/null 2>&1
bind = $mainMod, B, exec, firefox
bind = $mainMod, E, exec, nks-open-file-manager
bind = $mainMod CTRL, E, exec, gnome-text-editor
bind = $mainMod, C, exec, gnome-calculator
bind = $mainMod CTRL, RETURN, exec, rofi -show drun
bind = $mainMod CTRL, K, exec, show-keybinds
bind = $mainMod, W, exec, customize
bind = $mainMod SHIFT, W, exec, customize wallpaper random
bind = $mainMod CTRL, W, exec, customize wallpaper
bind = $mainMod ALT, M, exec, nwg-displays

# Windows
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exec, sh -c 'kill "$(hyprctl activewindow -j | jq -r .pid)" 2>/dev/null || true'
bind = $mainMod, F, fullscreen,
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, T, togglefloating,
bind = $mainMod SHIFT, T, exec, ~/.local/bin/nekoroshell/toggle-workspace-float
bind = $mainMod ALT, T, exec, hyprctl dispatch togglefloating; hyprctl dispatch pin
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, K, layoutmsg, swapsplit
bind = $mainMod, G, togglegroup,

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Swap tiled windows
bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d

# Resize with Super + Shift + arrows
bind = $mainMod SHIFT, right, resizeactive, 100 0
bind = $mainMod SHIFT, left, resizeactive, -100 0
bind = $mainMod SHIFT, down, resizeactive, 0 100
bind = $mainMod SHIFT, up, resizeactive, 0 -100

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_up, workspace, e+1
bind = $mainMod, mouse_down, workspace, e-1

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, S, movetoworkspace, special:scratchpad

# Actions
bind = $mainMod CTRL, R, exec, hyprctl reload
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, A, exec, hyprctl keyword animations:enabled true
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod CTRL, T, exec, change-navbar-mode
bind = $mainMod SHIFT, B, exec, start-navbar
bind = $mainMod CTRL, L, exec, sys-power lock
bind = $mainMod SHIFT, H, exec, sunset-toggle
bind = $mainMod ALT, G, exec, nk-gamemode
bind = $mainMod SHIFT, PRINT, exec, screenshot
bind = $mainMod ALT, F, exec, screenshot --instant

# Laptop media keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

# Window dragging/resizing
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
