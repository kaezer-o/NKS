# NeKoRoSHELL Kitty configuration
include ~/.cache/wallust/colors-kitty.conf

shell /usr/bin/zsh

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0

window_padding_width 5 10
cursor_trail 3

# Conservative fallback if the generated palette has not been created yet.
foreground #EAEAEA
background #111111
cursor #EAEAEA
color0 #707070
color8 #A8A8A8
